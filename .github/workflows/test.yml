name: Tests

# RUNS THE TEST SUITE ON EVERY PULL REQUEST INTO main OR develop AND ON EVERY PUSH TO develop.
# REQUIRE THE "tests" CHECK ON main SO RELEASE PULL REQUESTS AUTO-MERGE ONLY WHEN IT PASSES.
# A CHANGE THAT TOUCHES ONLY CHANGES.md, OR A PUSH TO A PULL REQUEST THAT ONLY MOVED ITS BASE
# (A MERGE FROM, OR REBASE ONTO, THE BASE BRANCH THAT LEFT THE PULL REQUEST'S OWN CODE UNCHANGED,
# AFTER A PASSING RUN), SKIPS THE TEST JOB. THE DECISION IS THE SHARED change-scope WORKFLOW IN
# thespacedoctor/reusable-workflows. A JOB SKIPPED BY `if` PASSES A REQUIRED CHECK, UNLIKE A
# WORKFLOW SKIPPED BY `paths-ignore`, WHICH LEAVES IT PENDING
on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    permissions:
      contents: read
      actions: read
    uses: thespacedoctor/reusable-workflows/.github/workflows/change-scope.yml@main

  tests:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: unit_tests
          MYSQL_USER: utuser
          MYSQL_PASSWORD: utpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Allow LOAD DATA LOCAL INFILE on the server
        run: |
          mysql -h 127.0.0.1 -uroot -prootpass -e "SET GLOBAL local_infile=1"

      - name: Install package and test dependencies (stats extra holds astropy)
        run: python -m pip install -e ".[tests,stats]"

      - name: Run tests
        run: python -m pytest -m "not slow and not full"
