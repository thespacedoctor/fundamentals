name: Tests

# RUNS THE TEST SUITE ON EVERY PULL REQUEST INTO main OR develop AND ON EVERY PUSH TO develop.
# REQUIRE THE "tests" CHECK ON main SO RELEASE PULL REQUESTS AUTO-MERGE ONLY WHEN IT PASSES.
on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: unit_tests
          MYSQL_USER: utuser
          MYSQL_PASSWORD: utpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
          architecture: x64
          check-latest: true
          cache: pip

      - name: Install package and test dependencies (stats extra holds astropy)
        run: python -m pip install -e ".[tests,stats]"

      - name: Run tests
        run: python -m pytest -m "not slow and not full"
